server:
  host: 127.0.0.1
  port: 8080
  debug: true

cors:
  origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    
rag_data:
  faiss_index: rag_data/faiss.index
  metadata: rag_data/faiss_metadata.json

build_faiss:
  output_folder: rag_data

docs_data:
  path: data/

# Embedding model configuration
embedding:
  # Default model to use for embeddings
  default_model: text-embedding-3-small
  
  # Available models with their pricing and configuration
  models:
    text-embedding-3-small:
      price_per_1k_tokens: 0.00002  # $0.00002 per 1K tokens
      encoding: cl100k_base
      description: "Most cost-effective, recommended for production"
      dimension: 1536
      
    text-embedding-ada-002:
      price_per_1k_tokens: 0.0001   # $0.0001 per 1K tokens
      encoding: text-embedding-ada-002
      description: "Legacy model, maintained for compatibility"
      dimension: 1536
      
    text-embedding-3-large:
      price_per_1k_tokens: 0.00013  # $0.00013 per 1K tokens
      encoding: cl100k_base
      description: "Highest quality, highest cost"
      dimension: 3072

# Document caching configuration
caching:
  # Database path for cache storage
  db_path: rag_data/document_cache.db
  
  # Default time-to-live for cached results (in hours)
  default_ttl_hours: 24
  
  # Cache settings for different document processors
  processors:
    summary:
      ttl_hours: 24
      enabled: true
    faq:
      ttl_hours: 48
      enabled: true
    comparison:
      ttl_hours: 72
      enabled: true
  
  # Cache cleanup settings
  cleanup:
    # Enable automatic cleanup of expired entries
    auto_cleanup: true
    # Cleanup interval in hours
    cleanup_interval_hours: 6
    # Maximum cache size in MB (0 for unlimited)
    max_cache_size_mb: 100